<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кулінарний Калькулятор</title>
    
    <!-- Подключение манифеста приложения -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Теги для поддержки мобильных устройств -->
    <meta name="theme-color" content="#FF9800">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFFFFF;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Ваш сайт Google Sites, встроенный в приложение -->
    <iframe src="https://sites.google.com/view/sher73/%D0%B3%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F-%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D0%B0" allowfullscreen></iframe>

    <script>
        // Регистрация Service Worker для работы PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA успешно зарегистрировано!', reg))
                    .catch(err => console.log('Ошибка регистрации PWA:', err));
            });
        }
    </script>
</body>
</html>
